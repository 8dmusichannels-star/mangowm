name: Build MangoWM for Devuan

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    container:
      image: devuan/devuan:ceres
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Base tools
        run: |
          apt-get update
          apt-get install -y curl jq git ca-certificates

      - name: Get latest mangowm release
        id: mangowm_release
        run: |
          LATEST=$(curl -s https://api.github.com/repos/mangowm/mango/releases/latest | jq -r '.tag_name')
          echo "version=$LATEST" >> $GITHUB_OUTPUT
          echo "Latest mangowm: $LATEST"

      - name: Check if already built
        id: check
        run: |
          BUILT=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/releases/latest \
            | jq -r '.tag_name' 2>/dev/null || echo "none")
          echo "built=$BUILT" >> $GITHUB_OUTPUT
          if [ "$BUILT" = "${{ steps.mangowm_release.outputs.version }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Already built, skipping."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "New version detected, building."
          fi

      - name: Install base dependencies
        if: steps.check.outputs.skip == 'false'
        run: |
          apt-get update
          apt-get install -y \
            meson ninja-build build-essential cmake \
            python3-pip \
            libffi-dev libexpat1-dev libxml2-dev \
            libxkbcommon-dev \
            libseat-dev libpcre2-dev \
            libgbm-dev libudev-dev libevdev-dev \
            libmtdev-dev libwacom-dev \
            libegl-dev libgles-dev \
            hwdata pkg-config \
            libcjson-dev \
            libxcb1-dev \
            libxcb-composite0-dev \
            libxcb-xfixes0-dev \
            libxcb-xinput-dev \
            libxcb-icccm4-dev \
            libxcb-image0-dev \
            libxcb-render0-dev \
            libxcb-render-util0-dev \
            libxcb-ewmh-dev \
            libxcb-res0-dev \
            libx11-xcb-dev \
            libx11-dev \
            xwayland \
            dpkg-dev \
            libwayland-dev libwayland-bin wayland-protocols \
            libpixman-1-dev \
            libdrm-dev \
            libinput-dev \
            libdisplay-info-dev \
            liblcms2-dev \
            libvulkan-dev glslang-tools

      - name: Ensure recent meson
        if: steps.check.outputs.skip == 'false'
        run: |
          pip install --break-system-packages --upgrade meson
          meson --version

      - name: Build wlroots
        if: steps.check.outputs.skip == 'false'
        run: |
          git clone -b 0.20 https://gitlab.freedesktop.org/wlroots/wlroots.git
          cd wlroots
          meson setup build -Dprefix=/usr -Dxwayland=enabled
          ninja -C build install
          ldconfig

      - name: Build scenefx
        if: steps.check.outputs.skip == 'false'
        run: |
          git clone -b 0.5 https://github.com/wlrfx/scenefx.git
          cd scenefx
          meson setup build -Dprefix=/usr
          ninja -C build install
          ldconfig

      - name: Download mangowm source tarball
        if: steps.check.outputs.skip == 'false'
        run: |
          VERSION=${{ steps.mangowm_release.outputs.version }}
          curl -L \
            https://github.com/mangowm/mango/archive/refs/tags/${VERSION}.tar.gz \
            -o $GITHUB_WORKSPACE/mangowm.tar.gz
          tar -xzf $GITHUB_WORKSPACE/mangowm.tar.gz -C $GITHUB_WORKSPACE
          mv $GITHUB_WORKSPACE/mango-${VERSION#v} $GITHUB_WORKSPACE/mango 2>/dev/null || \
          mv $GITHUB_WORKSPACE/mango-${VERSION} $GITHUB_WORKSPACE/mango

      - name: Build mangowm
        if: steps.check.outputs.skip == 'false'
        run: |
          cd $GITHUB_WORKSPACE/mango
          meson setup build -Dprefix=/usr
          ninja -C build install

      - name: Package everything into one .deb
        if: steps.check.outputs.skip == 'false'
        run: |
          VERSION=${{ steps.mangowm_release.outputs.version }}
          PKGVER=${VERSION#v}
          PKGDIR=$GITHUB_WORKSPACE/mangowm-pkg

          mkdir -p $PKGDIR/DEBIAN
          mkdir -p $PKGDIR/usr/bin
          mkdir -p $PKGDIR/usr/lib
          mkdir -p $PKGDIR/usr/share

          DESTDIR=$PKGDIR ninja -C $GITHUB_WORKSPACE/mango/build install
          DESTDIR=$PKGDIR ninja -C $GITHUB_WORKSPACE/wlroots/build install
          DESTDIR=$PKGDIR ninja -C $GITHUB_WORKSPACE/scenefx/build install

          rm -rf $PKGDIR/usr/include
          rm -rf $PKGDIR/usr/lib/pkgconfig
          rm -rf $PKGDIR/usr/share/pkgconfig
          rm -rf $PKGDIR/usr/share/doc
          rm -rf $PKGDIR/usr/share/man
          rm -rf $PKGDIR/usr/share/wayland-protocols

          printf 'Package: mangowm-full\nVersion: %s-devuan1\nSection: x11\nPriority: optional\nArchitecture: amd64\nMaintainer: 8dmusichannels-star\nDescription: MangoWM Wayland compositor with wlroots and scenefx\n Includes mangowm, wlroots and scenefx built from source.\n' "$PKGVER" > $PKGDIR/DEBIAN/control

          printf '#!/bin/sh\nldconfig\n' > $PKGDIR/DEBIAN/postinst
          chmod 755 $PKGDIR/DEBIAN/postinst

          dpkg-deb --build $PKGDIR $GITHUB_WORKSPACE/mangowm-full-${VERSION}-devuan.deb

      - name: Publish Release
        if: steps.check.outputs.skip == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.mangowm_release.outputs.version }}
          name: MangoWM ${{ steps.mangowm_release.outputs.version }} for Devuan
          body: |
            Automatic build — MangoWM ${{ steps.mangowm_release.outputs.version }}, gerçek Devuan (ceres) container'ında derlendi.

            wlroots ve scenefx kaynaktan derlendi, diğer bağımlılıklar sistem paketlerinden kullanıldı.

            **Install:**
            ```bash
            wget https://github.com/${{ github.repository }}/releases/download/${{ steps.mangowm_release.outputs.version }}/mangowm-full-${{ steps.mangowm_release.outputs.version }}-devuan.deb
            sudo dpkg -i mangowm-full-${{ steps.mangowm_release.outputs.version }}-devuan.deb
            ```
          files: |
            ${{ github.workspace }}/mangowm-full-${{ steps.mangowm_release.outputs.version }}-devuan.deb
