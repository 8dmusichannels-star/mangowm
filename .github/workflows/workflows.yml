name: Build MangoWM for Devuan

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Get latest mangowm release
        id: mangowm_release
        run: |
          LATEST=$(curl -s https://api.github.com/repos/mangowm/mango/releases/latest | jq -r '.tag_name')
          echo "version=$LATEST" >> $GITHUB_OUTPUT
          echo "Latest mangowm: $LATEST"

      - name: Check if already built
        id: check
        run: |
          BUILT=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/releases/latest \
            | jq -r '.tag_name' 2>/dev/null || echo "none")
          echo "built=$BUILT" >> $GITHUB_OUTPUT
          if [ "$BUILT" = "${{ steps.mangowm_release.outputs.version }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Already built, skipping."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "New version detected, building."
          fi

      - name: Install base dependencies
        if: steps.check.outputs.skip == 'false'
        run: |
          sudo apt update
          sudo apt install -y \
            meson ninja-build git curl jq build-essential \
            libffi-dev libexpat1-dev libxml2-dev \
            libdrm-dev libxkbcommon-dev \
            libseat-dev libpcre2-dev \
            libgbm-dev libudev-dev libevdev-dev \
            libmtdev-dev libwacom-dev \
            libegl-dev libgles-dev \
            hwdata pkg-config \
            libcjson-dev \
            libxcb1-dev \
            libxcb-composite0-dev \
            libxcb-xfixes0-dev \
            libxcb-xinput-dev \
            libxcb-icccm4-dev \
            libxcb-image0-dev \
            libxcb-render0-dev \
            libxcb-render-util0-dev \
            libxcb-ewmh-dev \
            libxcb-res0-dev \
            libx11-xcb-dev \
            libx11-dev \
            xwayland \
            dpkg-dev

      - name: Build wayland
        if: steps.check.outputs.skip == 'false'
        run: |
          git clone -b 1.23.1 https://gitlab.freedesktop.org/wayland/wayland.git
          cd wayland
          meson build -Dprefix=/usr -Ddocumentation=false -Dtests=false
          sudo ninja -C build install
          sudo ldconfig

      - name: Build wayland-protocols
        if: steps.check.outputs.skip == 'false'
        run: |
          git clone -b 1.41 https://gitlab.freedesktop.org/wayland/wayland-protocols.git
          cd wayland-protocols
          meson build -Dprefix=/usr -Dtests=false
          sudo ninja -C build install
          sudo ldconfig

      - name: Build pixman
        if: steps.check.outputs.skip == 'false'
        run: |
          git clone -b pixman-0.43.4 https://gitlab.freedesktop.org/pixman/pixman.git
          cd pixman
          meson build -Dprefix=/usr -Dgtk=disabled -Dtests=disabled -Ddemos=disabled
          sudo ninja -C build install
          sudo ldconfig

      - name: Build libinput
        if: steps.check.outputs.skip == 'false'
        run: |
          git clone -b 1.27.1 https://gitlab.freedesktop.org/libinput/libinput.git
          cd libinput
          meson build -Dprefix=/usr -Ddocumentation=false -Dtests=false -Dlibwacom=false -Ddebug-gui=false
          sudo ninja -C build install
          sudo ldconfig

      - name: Build libdisplay-info
        if: steps.check.outputs.skip == 'false'
        run: |
          git clone https://gitlab.freedesktop.org/emersion/libdisplay-info.git
          cd libdisplay-info
          meson build -Dprefix=/usr
          sudo ninja -C build install
          sudo ldconfig

      - name: Build libliftoff
        if: steps.check.outputs.skip == 'false'
        run: |
          git clone https://gitlab.freedesktop.org/emersion/libliftoff.git
          cd libliftoff
          meson build -Dprefix=/usr
          sudo ninja -C build install
          sudo ldconfig

      - name: Build wlroots
        if: steps.check.outputs.skip == 'false'
        run: |
          git clone -b 0.19.3 https://gitlab.freedesktop.org/wlroots/wlroots.git
          cd wlroots
          meson build -Dprefix=/usr -Dxwayland=enabled
          sudo ninja -C build install
          sudo ldconfig

      - name: Build scenefx
        if: steps.check.outputs.skip == 'false'
        run: |
          git clone -b 0.4.1 https://github.com/wlrfx/scenefx.git
          cd scenefx
          meson build -Dprefix=/usr
          sudo ninja -C build install
          sudo ldconfig

      - name: Download mangowm source tarball
        if: steps.check.outputs.skip == 'false'
        run: |
          VERSION=${{ steps.mangowm_release.outputs.version }}
          curl -L \
            https://github.com/mangowm/mango/archive/refs/tags/${VERSION}.tar.gz \
            -o $GITHUB_WORKSPACE/mangowm.tar.gz
          tar -xzf $GITHUB_WORKSPACE/mangowm.tar.gz -C $GITHUB_WORKSPACE
          mv $GITHUB_WORKSPACE/mango-${VERSION#v} $GITHUB_WORKSPACE/mango 2>/dev/null || \
          mv $GITHUB_WORKSPACE/mango-${VERSION} $GITHUB_WORKSPACE/mango

      - name: Build mangowm
        if: steps.check.outputs.skip == 'false'
        run: |
          cd $GITHUB_WORKSPACE/mango
          meson build -Dprefix=/usr
          sudo ninja -C build install

      - name: Package everything into one .deb
        if: steps.check.outputs.skip == 'false'
        run: |
          VERSION=${{ steps.mangowm_release.outputs.version }}
          PKGVER=${VERSION#v}
          PKGDIR=$GITHUB_WORKSPACE/mangowm-pkg

          mkdir -p $PKGDIR/DEBIAN
          mkdir -p $PKGDIR/usr/bin
          mkdir -p $PKGDIR/usr/lib
          mkdir -p $PKGDIR/usr/share

          sudo DESTDIR=$PKGDIR ninja -C $GITHUB_WORKSPACE/mango/build install
          sudo DESTDIR=$PKGDIR ninja -C $GITHUB_WORKSPACE/wlroots/build install
          sudo DESTDIR=$PKGDIR ninja -C $GITHUB_WORKSPACE/scenefx/build install
          sudo DESTDIR=$PKGDIR ninja -C $GITHUB_WORKSPACE/libinput/build install
          sudo DESTDIR=$PKGDIR ninja -C $GITHUB_WORKSPACE/libliftoff/build install
          sudo DESTDIR=$PKGDIR ninja -C $GITHUB_WORKSPACE/libdisplay-info/build install
          sudo DESTDIR=$PKGDIR ninja -C $GITHUB_WORKSPACE/pixman/build install
          sudo DESTDIR=$PKGDIR ninja -C $GITHUB_WORKSPACE/wayland/build install

          sudo rm -rf $PKGDIR/usr/include
          sudo rm -rf $PKGDIR/usr/lib/pkgconfig
          sudo rm -rf $PKGDIR/usr/share/pkgconfig
          sudo rm -rf $PKGDIR/usr/share/doc
          sudo rm -rf $PKGDIR/usr/share/man
          sudo rm -rf $PKGDIR/usr/share/wayland-protocols

          printf 'Package: mangowm-full\nVersion: %s-devuan1\nSection: x11\nPriority: optional\nArchitecture: amd64\nMaintainer: 8dmusichannels-star\nConflicts: libwayland-client0, libwayland-server0, libwayland-cursor0, libwayland-bin, libpixman-1-0\nReplaces: libwayland-client0, libwayland-server0, libwayland-cursor0, libwayland-bin, libpixman-1-0\nProvides: libwayland-client0 (= 1.23.1), libwayland-server0 (= 1.23.1), libwayland-cursor0 (= 1.23.1), libwayland-bin (= 1.23.1), libpixman-1-0 (= 0.43.4)\nDescription: MangoWM Wayland compositor with all dependencies\n Includes mangowm, wlroots, scenefx, libinput, libliftoff, libdisplay-info, pixman and wayland libraries.\n' "$PKGVER" > $PKGDIR/DEBIAN/control
          
          printf '#!/bin/sh\nldconfig\n' > $PKGDIR/DEBIAN/postinst
          chmod 755 $PKGDIR/DEBIAN/postinst

          dpkg-deb --build $PKGDIR $GITHUB_WORKSPACE/mangowm-full-${VERSION}-devuan.deb
          
      - name: Publish Release
        if: steps.check.outputs.skip == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.mangowm_release.outputs.version }}
          name: MangoWM ${{ steps.mangowm_release.outputs.version }} for Deb
          body: |
            Automatic build — MangoWM ${{ steps.mangowm_release.outputs.version }} for Deb.

            All depends (wlroots, scenefx, libinput, vb.) one package.

            **Install:**
            ```bash
            wget https://github.com/${{ github.repository }}/releases/download/${{ steps.mangowm_release.outputs.version }}/mangowm-full-${{ steps.mangowm_release.outputs.version }}-devuan.deb
            sudo apt remove libwayland-bin libwayland-client0 libwayland-server0 libwayland-cursor0 libpixman-1-0
            sudo dpkg -i mangowm-full-${{ steps.mangowm_release.outputs.version }}.deb
            ```
          files: |
            ${{ github.workspace }}/mangowm-full-${{ steps.mangowm_release.outputs.version }}-devuan.deb
